version: '3.9'

services:

  mysql:
    image: mysql:8.0
    container_name: smart_security_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: smart_home_security
    ports:
      - "3306:3306"

  redis:
    image: redis:7
    container_name: smart_security_redis
    restart: always
    ports:
      - "6379:6379"
